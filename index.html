<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IRONLOG</title>
<style>
:root{
  --bg:#0B0D0F;
  --surface:#14171B;
  --surface2:#1C2025;
  --surface3:#22272D;
  --border:#262B31;
  --text:#F2F3F4;
  --text-dim:#8A9199;
  --text-faint:#565C63;
  --accent:#FF4B3E;
  --accent-dim:#5A211B;
  --success:#37D67A;
  --gold:#E8B44C;
  --radius:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
.mono{font-family:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",monospace;}
.disp{font-weight:800;text-transform:uppercase;letter-spacing:0.02em;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

#topbar{padding:18px 16px 10px;display:flex;align-items:center;justify-content:space-between;}
#topbar .brand{font-size:20px;letter-spacing:0.08em;}
#topbar .brand span{color:var(--accent);}
#topbar .streak{font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:5px;}
#topbar .streak b{color:var(--gold);font-family:ui-monospace,monospace;}

#screen{flex:1;padding:4px 16px 90px;overflow-y:auto;}
h2.section-title{font-size:13px;color:var(--text-dim);letter-spacing:0.12em;text-transform:uppercase;
  margin:22px 0 10px;font-weight:700;}
h2.section-title:first-child{margin-top:6px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
.card-tap{transition:transform .08s ease, background .15s ease;}
.card-tap:active{transform:scale(0.98);background:var(--surface2);}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.muted{color:var(--text-dim);}
.faint{color:var(--text-faint);}

.btn{border:none;border-radius:8px;padding:12px 16px;font-weight:700;font-size:14px;text-align:center;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:active{background:#e0392c;}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-ghost:active{background:var(--surface3);}
.btn-block{display:block;width:100%;}
.btn-sm{padding:8px 12px;font-size:12.5px;border-radius:7px;}
.btn-danger{background:transparent;color:var(--accent);border:1px solid var(--accent-dim);}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-dim);}
.empty-state .big{font-size:34px;margin-bottom:6px;}

#bottomnav{position:sticky;bottom:0;left:0;right:0;background:rgba(11,13,15,0.92);backdrop-filter:blur(10px);
  border-top:1px solid var(--border);display:flex;max-width:520px;margin:0 auto;width:100%;z-index:40;}
#bottomnav button{flex:1;background:none;border:none;color:var(--text-faint);padding:10px 0 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;letter-spacing:0.04em;
  text-transform:uppercase;font-weight:700;}
#bottomnav button.active{color:var(--accent);}
#bottomnav svg{width:20px;height:20px;}

.exblock{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
.exblock-head{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
.exblock-head .name{font-weight:700;font-size:15px;}
.exblock-head .cat{font-size:11px;color:var(--text-dim);}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 36px 30px;gap:8px;align-items:center;padding:7px 14px;font-size:14px;}
.setrow.head{color:var(--text-faint);font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;padding-bottom:2px;padding-top:10px;}
.setrow input[type=number]{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);
  border-radius:6px;padding:7px 6px;text-align:center;font-size:14px;}
.setrow input[type=number]:focus{outline:none;border-color:var(--accent);}
.setnum{color:var(--text-dim);font-size:13px;text-align:center;}
.checkbtn{width:28px;height:28px;border-radius:6px;border:1.5px solid var(--border);background:var(--surface2);
  display:flex;align-items:center;justify-content:center;color:var(--text-faint);}
.checkbtn.done{background:var(--success);border-color:var(--success);color:#06210F;}
.delbtn{width:26px;height:26px;border:none;background:none;color:var(--text-faint);font-size:16px;}
.addset{padding:10px 14px;color:var(--accent);font-weight:700;font-size:13px;text-align:center;border-top:1px solid var(--border);}

.pr-badge{display:inline-block;background:linear-gradient(135deg,var(--gold),#B8862F);color:#241a00;font-size:9.5px;
  font-weight:800;padding:2px 6px;border-radius:4px;letter-spacing:0.05em;margin-left:6px;transform:rotate(-3deg);}

#workoutOverlay{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;flex-direction:column;max-width:520px;margin:0 auto;}
#workoutOverlay.open{display:flex;}
.wo-header{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
.wo-header .timer{font-family:ui-monospace,monospace;font-size:15px;color:var(--text-dim);}
.wo-body{flex:1;overflow-y:auto;padding:14px 16px 100px;}
.wo-footer{position:sticky;bottom:0;padding:12px 16px;background:var(--bg);border-top:1px solid var(--border);}

#restTimer{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;z-index:120;
  background:var(--surface2);border-top:1px solid var(--border);padding:14px 18px;display:none;
  align-items:center;gap:14px;}
#restTimer.open{display:flex;}
.plate{position:relative;width:52px;height:52px;flex:none;}
.plate svg{width:52px;height:52px;transform:rotate(-90deg);}
.plate .ring-bg{fill:none;stroke:var(--surface3);stroke-width:5;}
.plate .ring-fg{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
.plate .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:ui-monospace,monospace;font-weight:700;font-size:13px;}
#restTimer .rt-controls{margin-left:auto;display:flex;gap:8px;}

.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
.chart-wrap .stat-row{display:flex;gap:18px;margin-top:8px;}
.stat-mini b{display:block;font-family:ui-monospace,monospace;font-size:18px;color:var(--text);}
.stat-mini span{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em;}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
.cal-grid .dow{font-size:10px;color:var(--text-faint);padding-bottom:4px;}
.cal-day{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;
  color:var(--text-dim);background:var(--surface2);}
.cal-day.has{background:var(--accent-dim);color:var(--text);font-weight:700;border:1px solid var(--accent);}
.cal-day.empty{background:transparent;}

#modalBg{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;display:none;align-items:flex-end;}
#modalBg.open{display:flex;}
#modalSheet{background:var(--surface);width:100%;max-width:520px;margin:0 auto;border-radius:16px 16px 0 0;
  max-height:88vh;overflow-y:auto;padding:16px 16px 30px;border-top:1px solid var(--border);}
.modal-title{font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:0.03em;margin-bottom:12px;
  display:flex;justify-content:space-between;align-items:center;}
.modal-title .x{color:var(--text-dim);font-size:22px;}

.field{margin-bottom:12px;}
.field label{display:block;font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:5px;}
.field input,.field select{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:10px 12px;border-radius:8px;font-size:15px;}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);}

.chip{display:inline-block;padding:6px 12px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);
  font-size:12.5px;color:var(--text-dim);margin:0 6px 6px 0;}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}

.exlist-item{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid var(--border);}
.exlist-item:last-child{border-bottom:none;}
.exlist-item .n{font-weight:600;font-size:14.5px;}

.drag-handle{cursor:grab;padding:6px 10px 6px 2px;color:var(--text-faint);font-size:18px;line-height:1;user-select:none;touch-action:none;}
.drag-handle:active{cursor:grabbing;color:var(--text-dim);}
.rt-ex-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
.rt-ex-head{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);gap:6px;}
.rt-ex-head .n{flex:1;font-weight:700;font-size:14.5px;}
.rt-set-row{display:grid;grid-template-columns:24px 1fr 1fr 28px;gap:8px;align-items:center;padding:6px 12px;}
.rt-set-row input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);
  border-radius:6px;padding:6px;text-align:center;font-size:13.5px;}
.rt-set-row input:focus{outline:none;border-color:var(--accent);}
.rt-add-set{padding:8px 12px;color:var(--accent);font-weight:700;font-size:12.5px;text-align:center;}
.rt-rest-row{padding:8px 12px 12px;border-top:1px solid var(--border);}
.rt-rest-row label{display:block;font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:5px;}
.rt-rest-row input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:8px 10px;border-radius:7px;font-size:14px;}
.rt-rest-row input:focus{outline:none;border-color:var(--accent);}
.exlist-item .c{font-size:11px;color:var(--text-faint);}
.addicon{width:26px;height:26px;border-radius:50%;background:var(--surface3);color:var(--accent);border:none;font-size:16px;
  display:flex;align-items:center;justify-content:center;}

::-webkit-scrollbar{width:0;height:0;}
</style>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', {scope: './'})

}

</div>

<div id="workoutOverlay">

    <button class="btn btn-ghost btn-sm" id="woCancel">Cancel</button>
  </div>
  <div class="wo-body" id="woBody"></div>
  <div class="wo-footer">
    <button class="btn btn-primary btn-block" id="woFinish">Finish Workout</button>
  </div>
</div>

<div id="restTimer">

  </div>
</div>

/* migrate old routine format (targetSets/targetReps) to new per-set model */
function migrateRoutineExercise(e){
  if(e.sets && Array.isArray(e.sets)) return e;
  const ts = e.targetSets||3, tr = e.targetReps||10;
  return {exerciseId:e.exerciseId, sets:Array.from({length:ts},()=>({weight:0,reps:tr})), restSeconds:null};
}
(state.routines||[]).forEach(r=>{ r.exercises = (r.exercises||[]).map(migrateRoutineExercise); });
save();

/* generic press-and-drag reordering for a list of DOM items backed by an array.
   itemSelector elements must contain a child with class "drag-handle" (data-i = current index). */
function makeReorderable(containerEl, itemSelector, arrayRef, onChange){
  if(!containerEl) return;
  containerEl.querySelectorAll(itemSelector).forEach((item)=>{
    const handle = item.querySelector(".drag-handle");
    if(!handle) return;
    handle.style.touchAction = "none";
    handle.onpointerdown = (e)=>{
      e.preventDefault();
      const origIndex = Array.from(containerEl.querySelectorAll(itemSelector)).indexOf(item);
      let startY = e.clientY;
      item.style.position = "relative";
      item.style.zIndex = "50";
      item.style.opacity = "0.88";
      item.style.boxShadow = "0 8px 20px rgba(0,0,0,0.45)";
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}
      const move = (ev)=>{
        const dy = ev.clientY - startY;
        item.style.transform = `translateY(${dy}px)`;
      };
      const up = (ev)=>{
        item.style.transform = "";
        item.style.opacity = "";
        item.style.boxShadow = "";
        item.style.zIndex = "";
        const siblings = Array.from(containerEl.querySelectorAll(itemSelector)).filter(el=>el!==item);
        let newIndex = siblings.length;
        for(let i=0;i<siblings.length;i++){
          const r = siblings[i].getBoundingClientRect();
          const mid = r.top + r.height/2;
          if(ev.clientY < mid){ newIndex = i; break; }
        }
        handle.onpointermove = null;
        handle.onpointerup = null;
        try{ handle.releasePointerCapture(ev.pointerId); }catch(err){}
        if(newIndex !== origIndex){
          const [moved] = arrayRef.splice(origIndex,1);
          arrayRef.splice(newIndex,0,moved);
          onChange();
        }
      };
      handle.onpointermove = move;
      handle.onpointerup = up;
    };
  });
}

function defaultState(){
  return {
    routines: [],
    history: [],
    bodyweight: [],
    customExercises: [],
    settings: { unit:"lb", restSeconds:90 },
    activeWorkout: null
  };
}

/* coerce anything loaded from storage or an imported file into a well-formed state.
   Returns null if it doesn't look like IronLog data at all, so callers can refuse it
   instead of saving something that would crash every render from then on. */
function normalizeState(data){
  if(!data || typeof data!=="object" || Array.isArray(data)) return null;
  const keys = ["routines","history","bodyweight","customExercises","settings"];
  if(!keys.some(k=>k in data)) return null;
  const arr = (v)=>Array.isArray(v) ? v.filter(x=>x && typeof x==="object") : [];
  const num = (v)=>{ const n = Number(v); return isFinite(n) ? n : 0; };
  const str = (v)=>typeof v==="string" ? v : (v==null ? "" : String(v));
  const normSets = (sets, withFlags)=>arr(sets).map(s=>withFlags
    ? {weight:num(s.weight), reps:num(s.reps), completed:!!s.completed, isPR:!!s.isPR}
    : {weight:num(s.weight), reps:num(s.reps)});
  const normWorkout = (w)=>({
    ...w,
    id: str(w.id) || uid(),
    name: str(w.name) || "Workout",
    date: str(w.date) || new Date().toISOString(),
    startedAt: num(w.startedAt) || Date.now(),
    duration: num(w.duration),
    exercises: arr(w.exercises).map(e=>({...e, exerciseId:str(e.exerciseId), restSeconds:num(e.restSeconds)||null, sets:normSets(e.sets, true)}))
  });
  const settings = (data.settings && typeof data.settings==="object") ? data.settings : {};
  return {
    routines: arr(data.routines).map(r=>({
      id: str(r.id) || uid(),
      name: str(r.name) || "Routine",
      exercises: arr(r.exercises).map(migrateRoutineExercise).map(e=>({exerciseId:str(e.exerciseId), sets:normSets(e.sets, false), restSeconds:num(e.restSeconds)||null}))
    })),
    history: arr(data.history).map(normWorkout),
    bodyweight: arr(data.bodyweight).filter(b=>typeof b.date==="string" && num(b.weight)>0).map(b=>({date:b.date, weight:num(b.weight)})),
    customExercises: arr(data.customExercises).filter(e=>e.id).map(e=>({id:str(e.id), name:str(e.name)||"Custom Exercise", cat:str(e.cat)||"Other", custom:true})),
    settings: { unit: settings.unit==="kg" ? "kg" : "lb", restSeconds: num(settings.restSeconds)>0 ? num(settings.restSeconds) : 90 },
    activeWorkout: (data.activeWorkout && typeof data.activeWorkout==="object") ? normWorkout(data.activeWorkout) : null
  };
}

function load(){
  let raw = null;
  try{
    raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed = normalizeState(JSON.parse(raw));
      if(parsed) return parsed;
    }
  }catch(e){}
  /* stored data exists but is unreadable — keep a copy aside before the
     startup save() overwrites it, so it can still be recovered by hand */
  if(raw){ try{ localStorage.setItem(STORE_KEY+"_unreadable_"+Date.now(), raw); }catch(e){} }
  return defaultState();
}

function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    return true;
  }catch(e){
    if(!save.warned){
      save.warned = true;
      alert("Couldn't save to this device's storage (it may be full or blocked). Export a backup from Settings so you don't lose data.");
    }
    return false;
  }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function allExercises(){ return BUILTIN_EXERCISES.concat(state.customExercises); }
function exById(id){ return allExercises().find(e=>e.id===id); }

/* find how this exercise was last configured/performed, anywhere in the app —
   most recent actual workout takes priority, falling back to any routine that
   already has it configured. Used so a weight/rep combo you've already dialed
   in doesn't need to be re-entered every time the exercise shows up again. */
function getLastExerciseUsage(exerciseId){
  const sortedHistory = [...state.history].sort((a,b)=>b.date.localeCompare(a.date));
  for(const w of sortedHistory){
    const e = w.exercises.find(e=>e.exerciseId===exerciseId);
    if(e && e.sets && e.sets.length){
      return {
        sets: e.sets.map(s=>({weight:s.weight||0, reps:s.reps||0})),
        restSeconds: e.restSeconds || null
      };
    }
  }
  for(const r of state.routines){
    const e = r.exercises.find(e=>e.exerciseId===exerciseId);
    if(e && e.sets && e.sets.length){
      return {
        sets: e.sets.map(s=>({weight:s.weight||0, reps:s.reps||0})),
        restSeconds: e.restSeconds || null
      };
    }
  }
  return null;
}

function fmtDate(d){ const dt = new Date(d); return dt.toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
function fmtDateFull(d){ const dt = new Date(d); return dt.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"}); }
/* local calendar-day string (YYYY-MM-DD) using the device's local timezone.
   toISOString() always converts to UTC first, which silently shifts the date
   for anyone not in UTC+0 (e.g. a workout at 11pm UTC+5 becomes "yesterday").
   Every place that needs "what day did this happen" must go through this. */
function localDateStr(d){
  const dt = (d instanceof Date) ? d : new Date(d);
  const y = dt.getFullYear();
  const m = String(dt.getMonth()+1).padStart(2,"0");
  const day = String(dt.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function todayISO(){ return localDateStr(new Date()); }

function bestE1RM(exId, beforeDate){
  let best = 0;
  for(const w of state.history){
    if(beforeDate && w.date >= beforeDate) continue;
    const ex = w.exercises.find(e=>e.exerciseId===exId);
    if(!ex) continue;
    for(const s of ex.sets){
      if(!s.completed) continue;
      const e1 = EPLEY(s.weight, s.reps);
      if(e1 > best) best = e1;
    }
  }
  return best;
}

function computeStreak(){
  const days = [...new Set(state.history.map(w=>localDateStr(w.date)))].sort().reverse();
  if(days.length===0) return 0;
  let streak = 0;
  let cursor = new Date(); cursor.setHours(0,0,0,0);
  let d = new Date(cursor);
  while(true){
    const iso = localDateStr(d);
    if(days.includes(iso)){ streak++; d.setDate(d.getDate()-1); }
    else if(iso === localDateStr(cursor)){ d.setDate(d.getDate()-1); continue; }
    else break;
  }
  return streak;
}

/* ========== AUDIO + HAPTICS ENGINE ========== */
let _actx = null, _compressor = null, _masterGain = null;
function getACtx(){
  if(!_actx){
    _actx = new (window.AudioContext||window.webkitAudioContext)();
    _compressor = _actx.createDynamicsCompressor();
    _compressor.threshold.value = -16;
    _compressor.knee.value = 22;
    _compressor.ratio.value = 10;
    _compressor.attack.value = 0.002;
    _compressor.release.value = 0.18;
    _masterGain = _actx.createGain();
    _masterGain.gain.value = 1.6; /* overall loudness boost, safe because it's limited by the compressor below */
    _masterGain.connect(_compressor);
    _compressor.connect(_actx.destination);
  }
  if(_actx.state==='suspended') _actx.resume();
  return _actx;
}

function beep(freq=880, dur=0.08, vol=0.4, type='sine', delay=0){
  try{
    const ctx = getACtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(_masterGain);
    osc.type = type; osc.frequency.value = freq;
    const t = ctx.currentTime + delay;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol, t+0.005);
    gain.gain.exponentialRampToValueAtTime(0.001, t+dur);
    osc.start(t); osc.stop(t+dur+0.01);
  }catch(e){}
}

function haptic(pattern){
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}

    routineId: routine ? routine.id : null,
    name: routine ? routine.name : "Empty Workout",
    date: new Date().toISOString(),
    startedAt: Date.now(),
    exercises: routine ? routine.exercises.map(e=>({
      exerciseId: e.exerciseId,
      restSeconds: e.restSeconds || null,
      sets: e.sets.map(s=>({weight:s.weight||0, reps:s.reps||0, completed:false, isPR:false}))
    })) : []
  };
  save();
  document.getElementById("woTitle").textContent = state.activeWorkout.name;
  document.getElementById("workoutOverlay").classList.add("open");
  renderWorkoutBody();
  clearInterval(woInterval);
  woInterval = setInterval(updateWoTimer, 1000);
  updateWoTimer();
  refreshWorkoutNotification();
}

function updateWoTimer(){
  if(!state.activeWorkout) return;
  const secs = Math.floor((Date.now()-state.activeWorkout.startedAt)/1000);
  const m = String(Math.floor(secs/60)).padStart(2,"0");
  const s = String(secs%60).padStart(2,"0");
  document.getElementById("woTimer").textContent = `${m}:${s}`;
}

function renderWorkoutBody(){
  const w = state.activeWorkout;
  const body = document.getElementById("woBody");
  let html = w.exercises.map((e,ei)=>{
    const ex = exById(e.exerciseId);
    return `<div class="exblock" data-ei="${ei}">
      <div class="exblock-head"><span class="drag-handle" data-ei="${ei}">⠿</span><div><div class="name">${ex?escapeHtml(ex.name):"?"}</div><div class="cat">${ex?escapeHtml(ex.cat):""}${e.restSeconds?` · ${e.restSeconds}s rest`:""}</div></div>
      <button class="delbtn rm-exblock" data-ei="${ei}">✕</button></div>
      <div class="setrow head"><div>Set</div><div>${state.settings.unit}</div><div>Reps</div><div></div><div></div></div>
      ${e.sets.map((s,si)=>`
        <div class="setrow">
          <div class="setnum">${si+1}</div>
          <input type="number" inputmode="decimal" class="wInput" data-ei="${ei}" data-si="${si}" value="${s.weight||""}" placeholder="0">
          <input type="number" inputmode="numeric" class="rInput" data-ei="${ei}" data-si="${si}" value="${s.reps||""}" placeholder="0">
          <button class="checkbtn ${s.completed?"done":""} toggleSet" data-ei="${ei}" data-si="${si}">${s.completed?"✓":""}</button>
          <button class="delbtn rmSet" data-ei="${ei}" data-si="${si}">✕</button>
        </div>${s.isPR?`<div style="padding:0 14px 6px"><span class="pr-badge">NEW PR</span></div>`:""}`).join("")}
      <div class="addset addSetBtn" data-ei="${ei}">+ Add Set</div>
    </div>`;
  }).join("");
  html += `<button class="btn btn-ghost btn-block" id="woAddExBtn">+ Add Exercise</button>`;
  body.innerHTML = html;
  if(w.exercises.length===0){ body.innerHTML = `<div class="empty-state">Add an exercise to begin.</div><button class="btn btn-primary btn-block" id="woAddExBtn">+ Add Exercise</button>`; }

  document.getElementById("woAddExBtn")?.addEventListener("click", addExToActive);

  body.querySelectorAll(".wInput").forEach(inp=>inp.onchange=(e)=>{
    w.exercises[inp.dataset.ei].sets[inp.dataset.si].weight = parseFloat(inp.value)||0; save();
  });
  body.querySelectorAll(".rInput").forEach(inp=>inp.onchange=(e)=>{
    w.exercises[inp.dataset.ei].sets[inp.dataset.si].reps = parseInt(inp.value)||0; save();
  });
  body.querySelectorAll(".toggleSet").forEach(b=>b.onclick=()=>{
    const ei=b.dataset.ei, si=b.dataset.si;
    const set = w.exercises[ei].sets[si];
    set.completed = !set.completed;
    if(set.completed){
      const exId = w.exercises[ei].exerciseId;
      const best = bestE1RM(exId);
      const e1 = EPLEY(set.weight, set.reps);
      set.isPR = set.weight>0 && e1 > best;
      soundSetDone(set.isPR);
      startRestTimer(w.exercises[ei].restSeconds || state.settings.restSeconds, ei);
    } else { set.isPR = false; soundSetUndo(); }
    save(); renderWorkoutBody();
    if(!set.completed) refreshWorkoutNotification();
  });
  body.querySelectorAll(".rmSet").forEach(b=>b.onclick=()=>{
    w.exercises[b.dataset.ei].sets.splice(b.dataset.si,1); save(); renderWorkoutBody();
    refreshWorkoutNotification();
  });
  body.querySelectorAll(".addSetBtn").forEach(b=>b.onclick=()=>{
    const sets = w.exercises[b.dataset.ei].sets;
    const last = sets[sets.length-1];
    sets.push({weight:last?last.weight:0, reps:last?last.reps:0, completed:false, isPR:false});
    save(); renderWorkoutBody();
    refreshWorkoutNotification();
  });
  body.querySelectorAll(".rm-exblock").forEach(b=>b.onclick=()=>{
    w.exercises.splice(b.dataset.ei,1); save(); renderWorkoutBody();
    refreshWorkoutNotification();
  });
  makeReorderable(body, ".exblock", w.exercises, ()=>{ save(); renderWorkoutBody(); refreshWorkoutNotification(); });
}

function addExToActive(){
  openExercisePicker((ex)=>{
    const usage = getLastExerciseUsage(ex.id);
    const sets = usage
      ? usage.sets.map(s=>({weight:s.weight, reps:s.reps, completed:false, isPR:false}))
      : [{weight:0,reps:10,completed:false,isPR:false}];
    state.activeWorkout.exercises.push({exerciseId:ex.id, restSeconds: usage?usage.restSeconds:null, sets});
    soundAddEx();
    save(); closeModal(); renderWorkoutBody();
    refreshWorkoutNotification();
  });
}

function routineDiffersFromWorkout(routine, workout){
  if(routine.exercises.length !== workout.exercises.length) return true;
  for(let i=0;i<workout.exercises.length;i++){
    const re = routine.exercises[i], we = workout.exercises[i];
    if(!re || re.exerciseId !== we.exerciseId) return true;
    if(re.sets.length !== we.sets.length) return true;
    for(let j=0;j<we.sets.length;j++){
      if((re.sets[j].weight||0) !== (we.sets[j].weight||0) || (re.sets[j].reps||0) !== (we.sets[j].reps||0)) return true;
    }
  }
  return false;
}

function applyRoutineUpdate(routine, workout, fullUpdate){
  const idx = state.routines.findIndex(r=>r.id===routine.id);
  if(idx<0) return;
  const oldByExId = {};
  routine.exercises.forEach(e=>{ oldByExId[e.exerciseId]=e; });
  const newExercises = workout.exercises.map(we=>{
    const old = oldByExId[we.exerciseId];
    if(fullUpdate){
      return {
        exerciseId: we.exerciseId,
        sets: we.sets.map(s=>({weight:s.weight||0, reps:s.reps||0})),
        restSeconds: old ? old.restSeconds : (we.restSeconds || null)
      };
    }
    if(old) return old;
    return { exerciseId: we.exerciseId, sets: we.sets.map(s=>({weight:s.weight||0, reps:s.reps||0})), restSeconds: we.restSeconds || null };
  });
  state.routines[idx] = {...routine, exercises:newExercises};
  save();
}

document.getElementById("woFinish").onclick = ()=>{
  const w = state.activeWorkout;
  const totalSets = w.exercises.reduce((s,e)=>s+e.sets.filter(s2=>s2.completed).length,0);
  if(totalSets===0){ if(!confirm("No sets completed. Finish anyway?")) return; }
  w.duration = Math.floor((Date.now()-w.startedAt)/1000);
  w.exercises = w.exercises.filter(e=>e.sets.some(s=>s.completed)).map(e=>({...e, sets:e.sets.filter(s=>s.completed)}));

  const sourceRoutine = w.routineId ? state.routines.find(r=>r.id===w.routineId) : null;

  function finalizeWorkout(){
    state.history.push(w);
    state.activeWorkout = null;
    save();
    clearInterval(woInterval);
    document.getElementById("workoutOverlay").classList.remove("open");
    _isResting = false;
    clearInterval(restInterval);
    document.getElementById("restTimer").classList.remove("open");
    document.title = "IronLog";
    closeWorkoutNotification();
    soundWorkoutDone();
    currentTab = "home"; render();
  }

  if(sourceRoutine && routineDiffersFromWorkout(sourceRoutine, w)){
    openModal(`
      <div class="modal-title">Update Routine?<span class="x" id="mCloseA">&times;</span></div>
      <div class="muted" style="margin-bottom:16px">Today's workout was different from "${escapeHtml(sourceRoutine.name)}". Update the routine to match what you did?</div>
      <button class="btn btn-ghost btn-block" id="keepRoutineBtn" style="margin-bottom:8px">Keep Routine As-Is</button>
      <button class="btn btn-primary btn-block" id="updateRoutineBtn">Update Routine</button>
    `);
    document.getElementById("mCloseA").onclick = ()=>{ closeModal(); finalizeWorkout(); };
    document.getElementById("keepRoutineBtn").onclick = ()=>{ closeModal(); finalizeWorkout(); };
    document.getElementById("updateRoutineBtn").onclick = ()=>{
      openModal(`
        <div class="modal-title">Update Sets & Weights Too?<span class="x" id="mCloseB">&times;</span></div>
        <div class="muted" style="margin-bottom:16px">Should the routine also adopt today's exact sets, reps, and weights as its new defaults?</div>
        <button class="btn btn-ghost btn-block" id="justExBtn" style="margin-bottom:8px">Just Update Exercise List</button>
        <button class="btn btn-primary btn-block" id="fullUpdateBtn">Update Everything</button>
      `);
      document.getElementById("mCloseB").onclick = ()=>{ closeModal(); finalizeWorkout(); };
      document.getElementById("justExBtn").onclick = ()=>{
        applyRoutineUpdate(sourceRoutine, w, false);
        closeModal(); finalizeWorkout();
      };
      document.getElementById("fullUpdateBtn").onclick = ()=>{
        applyRoutineUpdate(sourceRoutine, w, true);
        closeModal(); finalizeWorkout();
      };
    };
  } else {
    finalizeWorkout();
  }
};

if(state.activeWorkout){
  document.getElementById("woTitle").textContent = state.activeWorkout.name;
  document.getElementById("workoutOverlay").classList.add("open");
  renderWorkoutBody();

let restEndTime = 0, restTotal = 0, _lastCountdownSecond = null, _isResting = false;

function startRestTimer(seconds){
  restTotal = seconds;
  restEndTime = Date.now() + seconds*1000;
  _lastCountdownSecond = null;
  _isResting = true;
  document.getElementById("restTimer").classList.add("open");
  soundRestStart();
  clearInterval(restInterval);
  tickRest();
  /* tick every 250ms so the UI is smooth, but always compute remaining
     from wall-clock time so backgrounding/throttling never causes drift */
  restInterval = setInterval(tickRest, 250);
  refreshWorkoutNotification();
}

function tickRest(){
  const remaining = Math.max(0, Math.ceil((restEndTime - Date.now())/1000));
  if(remaining !== _lastCountdownSecond){
    _lastCountdownSecond = remaining;
    if(remaining>0 && remaining<=3) soundCountdown();
    document.title = remaining>0 ? `⏱ ${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,"0")} rest — IronLog` : "IronLog";
    if(remaining>0 && remaining%5===0) refreshWorkoutNotification();
  }
  updateRestUI(remaining);
  if(remaining<=0){
    soundRestDone();
    stopRestTimer({alert:true});
  }
}

function updateRestUI(remaining){
  const m = Math.floor(remaining/60), s = remaining%60;
  document.getElementById("restNum").textContent = `${m}:${String(s).padStart(2,"0")}`;
  const circumference = 138;
  const frac = restTotal>0 ? remaining/restTotal : 0;
  document.getElementById("restRing").style.strokeDashoffset = (circumference*(1-frac)).toFixed(1);
}

/* opts.alert=true only for a natural rest-complete (worth an audible ping);
   a manual skip stays quiet and just moves the notification to the "ready" state */
function stopRestTimer(opts){
  opts = opts || {};
  clearInterval(restInterval);
  document.getElementById("restTimer").classList.remove("open");
  document.title = "IronLog";
  _isResting = false;
  refreshWorkoutNotification({alert: !!opts.alert});
}

function addRestTime(sec){
  restEndTime += sec*1000;
  restTotal += sec;
  tickRest();
}

document.getElementById("restSkip").onclick = ()=>stopRestTimer({alert:false});
document.getElementById("restAdd").onclick = ()=>addRestTime(30);

/* re-sync the instant the tab/screen becomes visible again, since
   background tabs can pause timers entirely on some devices */
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible" && restEndTime && document.getElementById("restTimer").classList.contains("open")){
    tickRest();
  }
});

/* ===== Persistent workout notification (Log Set / Skip actions via service worker) =====
   One notification lives for the whole active workout — from start to finish/discard —
   instead of appearing only during rest. Its content is always recomputed fresh from
   current state rather than captured once, so it can never point at a stale set, and
   its action-button layout is kept identical across every "resting" update so a
   background refresh can never shift which button is under the person's thumb. */
let _notifPermRequested = false;
function ensureNotifPermission(){
  if(!("Notification" in window) || _notifPermRequested) return;
  _notifPermRequested = true;
  if(Notification.permission === "default"){
    Notification.requestPermission().catch(()=>{});
  }
}

/* scans the active workout in order and returns the first exercise that still
   has an incomplete set — this is what makes the notification naturally move
   on to the next exercise once the current one's sets are all done */
function getNextPendingSet(){
  if(!state.activeWorkout) return null;
  const exs = state.activeWorkout.exercises;
  for(let ei=0; ei<exs.length; ei++){
    const exObj = exs[ei];
    const nextSet = exObj.sets.find(s=>!s.completed);
    if(nextSet){
      const meta = exById(exObj.exerciseId);
      return {ei, exObj, nextSet, name: meta ? meta.name : "Exercise"};
    }
  }
  return null;
}

function refreshWorkoutNotification(opts){
  opts = opts || {};
  if(!("serviceWorker" in navigator) || !("Notification" in window)) return;
  if(Notification.permission !== "granted") return;
  if(!state.activeWorkout){ closeWorkoutNotification(); return; }

  const pending = getNextPendingSet();
  let title, body, actions;

  if(_isResting){
    const remaining = Math.max(0, Math.ceil((restEndTime - Date.now())/1000));
    const timeStr = `${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,"0")}`;
    title = "IronLog — Resting";
    if(pending){
      body = `Resting ${timeStr} — Next: ${pending.nextSet.weight}${state.settings.unit}×${pending.nextSet.reps} ${pending.name}`;
      actions = [{action:"skip", title:"Skip Rest"}, {action:"complete", title:"✓ Log Set"}];
    } else {
      body = `Resting ${timeStr}`;
      actions = [{action:"skip", title:"Skip Rest"}];
    }
  } else if(pending){
    title = "IronLog — Ready";
    body = `Up next: ${pending.nextSet.weight}${state.settings.unit}×${pending.nextSet.reps} — ${pending.name}`;
    actions = [{action:"complete", title:"✓ Log Set"}];
  } else {
    title = "IronLog — Workout Complete";
    body = "All sets logged — tap Finish Workout in the app 💪";
    actions = [];
  }

  navigator.serviceWorker.ready.then(reg=>{
    reg.showNotification(title, {
      body,
      tag: "ironlog-workout",
      renotify: !!opts.alert,
      silent: !opts.alert,
      vibrate: opts.alert ? [50,30,50,30,180] : undefined,
      icon: "icon-192.png",
      badge: "icon-192.png",
      requireInteraction: true,
      actions
    }).catch(()=>{});
  });
}

function closeWorkoutNotification(){
  if(!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.ready.then(reg=>{
    reg.getNotifications({tag:"ironlog-workout"}).then(list=>list.forEach(n=>n.close()));
  }).catch(()=>{});
}

function completeNextSetFromNotification(){
  const pending = getNextPendingSet();
  if(!pending) return;
  const {exObj, nextSet} = pending;
  nextSet.completed = true;
  const best = bestE1RM(exObj.exerciseId);
  const e1 = EPLEY(nextSet.weight, nextSet.reps);
  nextSet.isPR = nextSet.weight>0 && e1 > best;
  soundSetDone(nextSet.isPR);
  save();
  if(document.getElementById("workoutOverlay").classList.contains("open")) renderWorkoutBody();
  startRestTimer(exObj.restSeconds || state.settings.restSeconds);
}

if("serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("message", (event)=>{
    const d = event.data;
    if(!d || !d.type) return;
    if(d.type === "rest-skip") stopRestTimer({alert:false});
    else if(d.type === "rest-complete-next") completeNextSetFromNotification();
  });
}

function renderHistory(){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const first = new Date(y,m,1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const workoutDays = new Set(state.history.map(w=>localDateStr(w.date)));

  let cal = `<div class="cal-grid">` + ["S","M","T","W","T","F","S"].map(d=>`<div class="dow">${d}</div>`).join("");
  for(let i=0;i<startDow;i++) cal += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = localDateStr(new Date(y,m,d));
    cal += `<div class="cal-day ${workoutDays.has(iso)?"has":""}">${d}</div>`;
  }
  cal += `</div>`;

  const sorted = [...state.history].sort((a,b)=>b.date.localeCompare(a.date));
  let list = sorted.map(w=>{
    const vol = w.exercises.reduce((s,e)=>s+e.sets.reduce((s2,st)=>s2+st.weight*st.reps,0),0);
    const hasPR = w.exercises.some(e=>e.sets.some(s=>s.isPR));
    return `<div class="card card-tap hist-card" data-id="${escapeAttr(w.id)}">
      <div class="row"><div style="font-weight:700">${escapeHtml(w.name)} ${hasPR?'<span class="pr-badge">PR</span>':""}</div>
      <div class="faint" style="font-size:12px">${fmtDate(w.date)}</div></div>
      <div class="muted" style="font-size:12.5px;margin-top:4px">${w.exercises.length} exercises · ${vol.toLocaleString()} ${state.settings.unit} · ${Math.round((w.duration||0)/60)} min</div>
    </div>`;
  }).join("");
  if(sorted.length===0) list = `<div class="empty-state faint">No workouts logged yet.</div>`;

  screenEl.innerHTML = `<h2 class="section-title" style="margin-top:6px">${now.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</h2>
    <div class="card">${cal}</div>
    <h2 class="section-title">All Workouts</h2>${list}`;

  screenEl.querySelectorAll(".hist-card").forEach(c=>c.onclick=()=>openWorkoutDetail(c.dataset.id));
}

function svgLineChart(points){
  const w=460, h=140, pad=28;
  if(points.length===0) return `<div class="faint" style="padding:20px 0;text-align:center">Not enough data yet.</div>`;
  const ys = points.map(p=>p.y);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const range = (maxY-minY)||1;
  const stepX = points.length>1 ? (w-2*pad)/(points.length-1) : 0;
  const coords = points.map((p,i)=>{
    const x = pad + i*stepX;
    const y = h-pad - ((p.y-minY)/range)*(h-2*pad);
    return [x,y];
  });
  const path = coords.map((c,i)=>(i===0?"M":"L")+c[0].toFixed(1)+","+c[1].toFixed(1)).join(" ");
  const areaPath = path + ` L${coords[coords.length-1][0].toFixed(1)},${h-pad} L${coords[0][0].toFixed(1)},${h-pad} Z`;
  const dots = coords.map((c)=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3" fill="var(--accent)"/>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:140px">
    <path d="${areaPath}" fill="var(--accent)" opacity="0.08"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <text x="${pad}" y="14" fill="var(--text-faint)" font-size="10" font-family="monospace">${maxY.toLocaleString()}</text>
    <text x="${pad}" y="${h-pad+16}" fill="var(--text-faint)" font-size="10" font-family="monospace">${minY.toLocaleString()}</text>
  </svg>`;
}

function renderProgress(){
  const exIds = [...new Set(state.history.flatMap(w=>w.exercises.map(e=>e.exerciseId)))];
  let selectedEx = window.__progressExId || exIds[0];
  if(!exIds.includes(selectedEx)) selectedEx = exIds[0];
  window.__progressExId = selectedEx;

  let html = `<h2 class="section-title" style="margin-top:6px">Strength Progress</h2>`;
  if(exIds.length===0){
    html += `<div class="empty-state"><div class="big">📈</div>Log a few workouts to see progress charts.</div>`;
  } else {
    const points = state.history.filter(w=>w.exercises.some(e=>e.exerciseId===selectedEx))
      .sort((a,b)=>a.date.localeCompare(b.date))
      .map((w,i)=>{
        const e = w.exercises.find(e=>e.exerciseId===selectedEx);
        const best = Math.max(...e.sets.map(s=>EPLEY(s.weight,s.reps)));
        return {x:i, y:best};
      });
    const volPoints = state.history.filter(w=>w.exercises.some(e=>e.exerciseId===selectedEx))
      .sort((a,b)=>a.date.localeCompare(b.date))
      .map((w,i)=>{
        const e = w.exercises.find(e=>e.exerciseId===selectedEx);
        const vol = e.sets.reduce((s,st)=>s+st.weight*st.reps,0);
        return {x:i, y:vol};
      });
    const currentBest = points.length ? Math.max(...points.map(p=>p.y)) : 0;

    html += `<div class="field"><select id="progExSelect">${exIds.map(id=>`<option value="${escapeAttr(id)}" ${id===selectedEx?"selected":""}>${escapeHtml(exById(id)?.name||"?")}</option>`).join("")}</select></div>
    <div class="chart-wrap">
      <div class="row"><div class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:0.05em">Estimated 1RM</div></div>
      ${svgLineChart(points)}
      <div class="stat-row">
        <div class="stat-mini"><b>${currentBest.toLocaleString()}</b><span>Best e1RM (${state.settings.unit})</span></div>
        <div class="stat-mini"><b>${points.length}</b><span>Sessions Logged</span></div>
      </div>
    </div>
    <div class="chart-wrap">
      <div class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:0.05em">Volume Per Session</div>
      ${svgLineChart(volPoints)}
    </div>`;
  }

  const bwSorted = [...state.bodyweight].sort((a,b)=>b.date.localeCompare(a.date));
  const bwChartPoints = [...state.bodyweight].sort((a,b)=>a.date.localeCompare(b.date)).map((b,i)=>({x:i,y:b.weight}));
  html += `<h2 class="section-title">Body Weight</h2>
  <div class="chart-wrap">
    ${svgLineChart(bwChartPoints)}
    <div class="row" style="margin-top:10px;gap:8px">
      <input id="bwInput" type="number" inputmode="decimal" placeholder="Weight (${state.settings.unit})" style="flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:9px 10px;border-radius:8px">
      <button class="btn btn-primary btn-sm" id="bwAdd">Log</button>
    </div>
    ${bwSorted.length ? `<div style="margin-top:14px">${bwSorted.slice(0,15).map(b=>{
      const idx = state.bodyweight.indexOf(b);
      return `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--border)">
        <div class="muted" style="font-size:13px">${fmtDate(b.date)}</div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="mono" style="font-weight:700">${b.weight} ${state.settings.unit}</span>
          <button class="delbtn edit-bw" data-idx="${idx}" title="Edit">✎</button>
          <button class="delbtn del-bw" data-idx="${idx}" title="Delete">✕</button>
        </div>
      </div>`;
    }).join("")}</div>` : ""}
  </div>`;

  screenEl.innerHTML = html;
  document.getElementById("progExSelect")?.addEventListener("change",(e)=>{ window.__progressExId=e.target.value; renderProgress(); });
  document.getElementById("bwAdd").onclick = ()=>{
    const val = parseFloat(document.getElementById("bwInput").value);
    if(!val) return;
    state.bodyweight.push({date:todayISO(), weight:val});
    save(); renderProgress();
  };
  screenEl.querySelectorAll(".edit-bw").forEach(b=>b.onclick=()=>{
    const idx = parseInt(b.dataset.idx);
    const entry = state.bodyweight[idx];
    if(!entry) return;
    openModal(`
      <div class="modal-title">Edit Weight<span class="x" id="mClose">&times;</span></div>
      <div class="field"><label>Date</label><input id="bwEditDate" type="date" value="${escapeAttr(entry.date)}"></div>
      <div class="field"><label>Weight (${state.settings.unit})</label><input id="bwEditWeight" type="number" inputmode="decimal" value="${entry.weight}"></div>
      <button class="btn btn-primary btn-block" id="bwEditSave">Save</button>
    `);
    document.getElementById("mClose").onclick = closeModal;
    document.getElementById("bwEditSave").onclick = ()=>{
      const newVal = parseFloat(document.getElementById("bwEditWeight").value);
      const newDate = document.getElementById("bwEditDate").value;
      if(!newVal || !newDate) return;
      state.bodyweight[idx] = {date:newDate, weight:newVal};
      save(); closeModal(); renderProgress();
    };
  });
  screenEl.querySelectorAll(".del-bw").forEach(b=>b.onclick=()=>{
    const idx = parseInt(b.dataset.idx);
    if(confirm("Delete this weight entry?")){
      state.bodyweight.splice(idx,1);
      save(); renderProgress();
    }
  });
}

function renderSettings(){
  screenEl.innerHTML = `
  <h2 class="section-title" style="margin-top:6px">Preferences</h2>
  <div class="card">
    <div class="field"><label>Weight Unit</label>
      <select id="unitSelect"><option value="lb" ${state.settings.unit==="lb"?"selected":""}>Pounds (lb)</option>
      <option value="kg" ${state.settings.unit==="kg"?"selected":""}>Kilograms (kg)</option></select>
    </div>
    <div class="field"><label>Default Rest Timer (seconds)</label>
      <input id="restSelect" type="number" value="${state.settings.restSeconds}">
    </div>
  </div>
  <h2 class="section-title">Data</h2>
  <div class="card">
    <div class="muted" style="font-size:13px;margin-bottom:10px">All data is stored only on this device. Back it up regularly.</div>
    <button class="btn btn-ghost btn-block" id="exportBtn" style="margin-bottom:8px">Export Data (.json)</button>
    <button class="btn btn-ghost btn-block" id="importBtn" style="margin-bottom:8px">Import Data</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
    <button class="btn btn-danger btn-block" id="wipeBtn">Erase All Data</button>
  </div>
  <div class="faint" style="text-align:center;font-size:11.5px;margin-top:20px">IRONLOG · fully offline · your data never leaves this device</div>
  `;
  document.getElementById("unitSelect").onchange = (e)=>{ state.settings.unit=e.target.value; save(); };
  document.getElementById("restSelect").onchange = (e)=>{ state.settings.restSeconds=parseInt(e.target.value)||90; save(); };
  document.getElementById("exportBtn").onclick = ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `ironlog-backup-${todayISO()}.json`; a.click();
    URL.revokeObjectURL(url);
  };
  document.getElementById("importBtn").onclick = ()=>document.getElementById("importFile").click();
  document.getElementById("importFile").onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      e.target.value = "";
      let data = null;
      try{ data = normalizeState(JSON.parse(reader.result)); }catch(err){}
      if(!data){ alert("Invalid backup file."); return; }
      if(!confirm(`Import ${data.history.length} workouts and ${data.routines.length} routines? This will replace all current data.`)) return;
      state = data; save(); render();
    };
    reader.readAsText(file);
  };
  document.getElementById("wipeBtn").onclick = ()=>{
    if(confirm("This will permanently erase all workouts, routines, and progress. Continue?")){
      state = defaultState(); save();
      clearInterval(woInterval);
      stopRestTimer({alert:false});
      closeWorkoutNotification();
      document.getElementById("workoutOverlay").classList.remove("open");
      render();
    }
  };
}

function openModal(html){
  document.getElementById("modalSheet").innerHTML = html;
  document.getElementById("modalBg").classList.add("open");
}
function closeModal(){ document.getElementById("modalBg").classList.remove("open"); }
document.getElementById("modalBg").addEventListener("click",(e)=>{ if(e.target.id==="modalBg") closeModal(); });

function escapeHtml(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

render();

})();
</script>
</body>
</html>
